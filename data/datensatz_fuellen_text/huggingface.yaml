# Hugging-Face-Datensätze – eintragen, dann `scamguard retrain`.
# Pro Datensatz ein Eintrag unter `datensaetze:`. Beispiel (mit # davor = inaktiv):
#
#  - id: organisation/datensatzname     # Hugging-Face-ID
#    split: train
#    spalten:                           # unser Feld: Spalte im Datensatz
#      description: text
#    label_spalte: label
#    labels:                            # optional – sonst werden 1/0, spam/ham … erkannt
#      1: betrug
#      0: seriös
#    # alles_ist: betrug                # statt label_spalte: ganzer Datensatz ist Betrug/seriös
#    nur_deutsch: true                  # nicht-deutsche Texte verwerfen
#    max_zeilen: 5000
#    lizenz: CC-BY-4.0
#
# Felder: title, description, messages, price, category, scam_type, image (Bildspalte)

# Hinweis: Einen deutschen Datensatz mit Kleinanzeigen-Betrug gibt es öffentlich nicht (Stand 10/2026).
# Die zwei Einträge unten sind SMS-/Spam-Texte – nützlich nur als Ergänzung für Chat-Nachrichten.
# Auf aktiv: true setzen. max_zeilen klein halten, sonst überstimmen sie die echten Inserate.
# Nie zum Auswerten nutzen (Testset), nur zum Trainieren.
# Nur seriöse Gegenbeispiele (z. B. zu `scamguard data sammeln`): unter labels nur die seriöse Klasse
# eintragen (z. B. nur `not_spam: seriös`) – Zeilen ohne passendes Label werden übersprungen.

datensaetze:
  - id: tanaos/synthetic-spam-detection-dataset-german
    split: train
    spalten:
      messages: text
    label_spalte: labels
    labels:
      spam: betrug
      not_spam: seriös
    max_zeilen: 500
    aktiv: false
    lizenz: MIT
    notiz: "Deutsch, synthetisch erzeugte Spam-/Normal-Nachrichten (10–20 Tsd.)"

  - id: dbarbedillo/SMS_Spam_Multilingual_Collection_Dataset
    split: train
    spalten:
      messages: text_de
    label_spalte: labels
    labels:
      spam: betrug
      ham: seriös
    max_zeilen: 500
    aktiv: false
    lizenz: GPL
    notiz: "SMS-Spam-Sammlung, maschinell ins Deutsche übersetzt (holprig)"
