# Grobe Gebrauchtpreis-Spannen (EUR) für häufig betroffene Artikel – Preisausreißer-Erkennung.
# Grobe Schätzung (Stand 2026-10): Untergrenzen bewusst vorsichtig, gelegentlich mit echten Marktdaten
# (Preisvergleich, eigene Labels) nachziehen. Schlüssel = Regex auf Titel/Beschreibung.
# Reihenfolge zählt: das erste passende Muster gewinnt → Spezifisches nach oben.
# Geprüft wird nur der Hauptartikel: Zubehör, Defektes, Such- und Tauschanzeigen nimmt
# features/price.py vorher aus („PS5 Controller 40 €“ ist kein Dumpingpreis).
# Signale (relativ zur Untergrenze): unter 40 % → PRICE_FAR_TOO_LOW, unter 65 % → PRICE_LOW.

items:
