# ScamGuard – zentrale Konfiguration
# Alle Pfade relativ zum Projektordner.

paths:
  data_dir: data
  models_dir: models
  lexicon: data/lexicons/scam_signals_de.yaml
  price_reference: data/lexicons/price_reference_de.yaml

# Ab welchem Gesamt-Score gilt ein Inserat als verdächtig / hochriskant?
thresholds:
  suspicious: 0.40
  high_risk: 0.70

# Annotation-Workspace (Web-App, Tab „Einstufen im Team“; Kategorien: data/einstufung/kategorien.yaml)
einstufung:
  # Arbeitsordner. Geht auch als gemeinsamer Ordner fürs Team (z. B. DHBW-OneDrive): Jede Person
  # schreibt nur ihre eigenen Dateien, gelesen werden die aller Personen. Den persönlichen Pfad
  # nicht hier eintragen (Datei liegt im Git), sondern per Umgebungsvariable:
  #   SCAMGUARD_EINSTUFUNG_ORDNER=~/OneDrive/ScamGuard-Einstufung scamguard ui
  ordner: data/einstufung
  # Anteil der Texte, den zwei Personen unabhängig einstufen (für die Übereinstimmung, Krippendorffs α)
  doppelt_anteil: 0.25

# Late Fusion: gewichteter Mittelwert der Einzelmodelle.
# Nicht verfügbare Modelle (nicht trainiert / deaktiviert) werden ignoriert,
# die übrigen Gewichte automatisch renormalisiert.
fusion:
  weights:
    rules: 1.0
    text_model: 1.5
    image_model: 0.7
    llm: 1.2
  # Ein einzelnes "hartes" Signal (z. B. Fake-Bezahlseite) hebt den Score mindestens hierauf.
  hard_signal_floor: 0.75

text_model:
  enabled: true
  # Deutsches BERT als Basis. Alternativen: "dbmdz/bert-base-german-cased",
  # "deepset/gelectra-base", "FacebookAI/xlm-roberta-base" (mehrsprachig).
  base_model: deepset/gbert-base
  path: models/text_classifier
  # Klassischer Fallback ohne GPU: TF-IDF + logistische Regression
  baseline_path: models/text_baseline.joblib
  max_length: 384
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5

image_model:
  enabled: true
  path: models/image_classifier.pt
  backbone: efficientnet_b0          # torchvision-Modellname
  clip_model: openai/clip-vit-base-patch32
  use_clip_consistency: true         # passt das Bild zur Kategorie/zum Titel?
  # Perceptual Hashes bekannter Fake-/Stockfotos (eine Hash-Zeile pro Bild)
  known_fake_hashes: data/lexicons/known_fake_image_hashes.txt
  epochs: 5
  batch_size: 32
  learning_rate: 1.0e-4

llm:
  # Für CLI/Streamlit; die Browser-Extension entscheidet pro Anfrage (Einstellung „KI-Analyse“).
  enabled: false
  # local     = Open-Weight-Modell auf diesem Rechner (kostenlos, Daten bleiben lokal)
  # anthropic = Claude API (kostet pro Anfrage, Daten gehen an Anthropic)
  provider: local
  max_tokens: 1024

  local:
    # OpenAI-kompatibler Server. Mac (Apple Silicon): `scamguard llm-server` (MLX).
    # PC mit AMD/NVIDIA-GPU: Ollama → http://127.0.0.1:11434/v1, LM Studio → http://127.0.0.1:1234/v1
    base_url: http://127.0.0.1:8080/v1
    # Neuestes Qwen, das in 16 GB passt (Stand 2026-10): Qwen3.5-9B, MLX-4-Bit (mixed precision)
    model: mlx-community/Qwen3.5-9B-OptiQ-4bit
    # Nach dem Feintuning (docs/llm_feintuning.md): Ordner mit adapters.safetensors, z. B. models/qwen_lora
    adapter_path: null
    timeout: 120
    temperature: 0.2

  anthropic:
    model: claude-opus-5-5
    effort: low                      # Klassifikation braucht kein tiefes Nachdenken
    use_fallbacks: true              # server-seitiger Fallback, falls das Modell ablehnt

  # Bilder ebenfalls ans LLM senden (nur provider: anthropic). Datenschutz beachten!
  send_images: false
