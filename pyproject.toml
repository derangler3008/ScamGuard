[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamguard"
version = "0.8.0"
description = "Betrugserkennung für deutschsprachige Kleinanzeigen (DHBW Mannheim KI-Projekt)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DHBW Mannheim – KI-Projektgruppe" }]

# Kern: läuft ohne GPU und ohne ML-Frameworks (Regel-Baseline + Frontend).
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pillow>=10.0",
    "streamlit>=1.35",
    "watchdog>=4,<7",  # Streamlit bemerkt Code-Änderungen effizient (sonst Hinweis beim Start)
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "tldextract>=5.1",
    "httpx>=0.27",  # lokales LLM (OpenAI-kompatibler Server)
    "beautifulsoup4>=4.12",  # gespeicherte Inseratsseiten (.html) hochladen
    "pypdf>=5.0",            # Inserat als PDF hochladen
    "pyobjc-framework-Vision>=11; sys_platform == 'darwin'",  # Texterkennung für Screenshots (Mac)
]

[project.optional-dependencies]
# Trainingsdaten von Hugging Face laden
data = ["datasets>=2.19", "huggingface_hub>=0.23"]
# Text-Transformer (z. B. GBERT) feintunen
text = ["torch>=2.2", "transformers>=4.41", "accelerate>=0.30", "datasets>=2.19"]
# Bildmodelle (CNN-Klassifikator, CLIP-Konsistenz, Perceptual Hash)
vision = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.41", "imagehash>=4.3"]
# LLM-Judge über die Claude API
llm = ["anthropic>=1.11"]
# Lokales LLM auf Apple Silicon (Qwen via MLX): `scamguard llm-server`
local-llm = ["mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Browser-Tests der Extension: danach `playwright install chromium`; Firefox muss installiert sein
e2e = ["playwright>=1.48", "selenium>=4.25", "imagehash>=4.3"]
all = ["scamguard[data,text,vision,llm,local-llm,dev]"]

[project.scripts]
scamguard = "scamguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/e2e"]
markers = ["e2e: Browser-Ende-zu-Ende-Tests der Extension (Playwright/Chromium, Selenium/Firefox)"]

[tool.ruff]
line-length = 100
target-version = "py310"
